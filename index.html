<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VTNetworks™</title>
<!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    img-src 'self' data:;
    style-src 'self' 'unsafe-inline';
    script-src 'self' 'unsafe-inline';
">
<script>
// Function to update favicon based on theme
function updateFavicon(theme) {
  const favicon = document.querySelector('link[rel="icon"]') || 
                 document.createElement('link');
  
  favicon.rel = 'icon';
  favicon.type = 'image/png';
  favicon.href = theme === 'dark' ? '/favicon-dark.ico' : '/favicon-light.ico';
  
  if (!document.querySelector('link[rel="icon"]')) {
    document.head.appendChild(favicon);
  }
}

// Listen for system theme changes
if (window.matchMedia) {
  const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
  
  // Set initial favicon
  updateFavicon(mediaQuery.matches ? 'dark' : 'light');
  
  // Listen for changes
  mediaQuery.addEventListener('change', (e) => {
    updateFavicon(e.matches ? 'dark' : 'light');
  });
}  
</script>  
<style>
body, html {
  height: 100%;
  margin: 0;
}

.bg {
  /* The image used */
  background-image: url("vtnetworks_logo.png");

  /* Full height */
  height: 100%; 

  /* Center and scale the image nicely */
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
}
.bg-footer-text {      
  position: absolute;      
  bottom: 20px;      
  width: 100%;      
  text-align: center;
  color: rgba(242, 222, 195, 0.5);      
  font-size: 7px;   
  font-style: italic;
  font-family: 'Source Sans Pro', sans-serif;
  text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5); /* subtiele schaduw */
}
.corner {
  position: absolute;
  border: 0.5px solid #f2dec3;
  z-index: 2;
}
.top-left {
  top: 0;
  left: 0;
  width: 5vw;
  height: 5vh;
  border-right: none;
  border-bottom: none;
}
.top-right {
  top: 0;
  right: 0;
  width: 5vw;
  height: 5vh;
  border-left: none;
  border-bottom: none;
}
.bottom-left {
  bottom: 0;
  left: 0;
  width: 5vw;
  height: 5vh;
  border-right: none;
  border-top: none;
}
.bottom-right {
  bottom: 0;
  right: 0;
  width: 5vw;
  height: 5vh;
  border-left: none;
  border-top: none;
}
</style>
</head>
<body>
  <div class="bg">    
    <div class="bg-footer-text">
     Copyright © 2025 VTNetworks™. Alle rechten voorbehouden.
    </div>  
    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>
  </div>  
</body>
</html>
